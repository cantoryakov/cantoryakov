    <script type="text/javascript">
  // Single Page Apps for GitHub Pages redirection catcher
  (function(l) {
    if (l.search[1] === '/' ) {
      var decoded = l.search.slice(1).split('&').map(function(s) { 
        return s.replace(/~and~/g, '&')
      }).reduce(function(acc, s) {
        var pair = s.split('=');
        acc[pair[0]] = decodeURIComponent(pair[1] || '');
        return acc;
      }, {});
      if (decoded.p !== undefined) {
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + (decoded.p || '') +
          (decoded.q ? ('?' + decoded.q) : '') +
          l.hash
        );
      }
    }
  }(window.location));
</script>

    <div id="root"></div>
    
    <dialog id="video-modal" class="video-modal">
      <div class="video-modal-container">
        <div class="video-modal-header">
          <button id="close-modal-btn" type="button" aria-label="Close video">&times;</button>
        </div>
        <div class="video-modal-player-wrapper">
          <video id="modal-video-player" controls playsinline preload="auto">
            Your browser does not support the video tag.
          </video>
        </div>
      </div>
    </dialog>

    <script>
      function openVideoModal(activeLetter) {
        const modal = document.getElementById('video-modal');
        const videoPlayer = document.getElementById('modal-video-player');
        if (!modal || !videoPlayer) return;

        const letterChar = activeLetter && typeof activeLetter === 'object' ? (activeLetter.letter || activeLetter.char || activeLetter.symbol || activeLetter.hebrew) : activeLetter;
        const videoUrl = `https://res.cloudinary.com/fn4r1p1x/video/upload/${encodeURIComponent(letterChar)}.mp4`;
        console.log("Loading letter video URL:", videoUrl);
        videoPlayer.src = videoUrl;
        videoPlayer.load();
        modal.showModal();
        document.getElementById('close-modal-btn')?.blur();
        videoPlayer.play().catch(err => console.warn("Autoplay blocked:", err));
      }

      function closeVideoModal() {
        const modal = document.getElementById('video-modal');
        const videoPlayer = document.getElementById('modal-video-player');
        if (!videoPlayer || !modal) return;

        videoPlayer.pause();
        try {
          videoPlayer.currentTime = 0;
        } catch (e) {}
        videoPlayer.removeAttribute('src');
        videoPlayer.load();
        modal.close();
      }

      document.addEventListener('DOMContentLoaded', () => {
        const modal = document.getElementById('video-modal');
        const closeBtn = document.getElementById('close-modal-btn');
        const container = modal ? modal.querySelector('.video-modal-container') : null;

        if (closeBtn) {
          closeBtn.addEventListener('click', closeVideoModal);
        }

        if (modal) {
          modal.addEventListener('click', (event) => {
            // Close if click is directly on the dialog backdrop (outside the inner content container)
            if (container && !container.contains(event.target)) {
              closeVideoModal();
            }
          });

          modal.addEventListener('cancel', (e) => {
            e.preventDefault();
            closeVideoModal();
          });
        }
      });

      window.openVideoModal = openVideoModal;
      window.closeVideoModal = closeVideoModal;
    </script>
